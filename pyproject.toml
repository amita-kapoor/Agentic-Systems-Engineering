[project]
name = "agentic-systems-engineering"
version = "0.1.0"
description = "Code listings for the book Agentic Systems Engineering"
requires-python = ">=3.10"
dependencies = []

# Per chapter, so readers install only what they need: uv sync --extra ch03
[project.optional-dependencies]
ch03 = ["langgraph~=1.2"]
ch04 = []
ch05 = [
    "pydantic~=2.13",
    "sentence-transformers~=5.6",
    "playwright~=1.61",
]
ch06 = [
    "openai~=2.48",
    "pydantic~=2.13",
]

[dependency-groups]
dev = ["ruff~=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Chapter listings, not an importable package.
bypass-selection = true
