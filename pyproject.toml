[project]
name = "agentic-systems-engineering"
version = "0.1.0"
description = "Code listings for the book Agentic Systems Engineering"
requires-python = ">=3.10"
dependencies = []

# Dependencies are grouped per chapter so a reader can install only what the
# chapter they are working through actually needs.
#
#   uv sync --extra ch03
#
# or, without uv:
#
#   pip install -e ".[ch03]"
#
# Constraints use the compatible-release operator: minor and patch updates are
# allowed, major versions are not. These frameworks move quickly, and an
# unpinned install is the main reason book code stops working a year after
# publication.
[project.optional-dependencies]
ch03 = ["langgraph~=1.2"]
ch04 = []
ch05 = [
    "pydantic~=2.13",
    "sentence-transformers~=5.6",
    "playwright~=1.61",
]
ch06 = [
    "openai~=2.48",
    "pydantic~=2.13",
]

[dependency-groups]
dev = ["ruff~=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The repository is a collection of chapter listings, not an importable package.
bypass-selection = true
