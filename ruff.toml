line-length = 100
target-version = "py310"

extend-exclude = [".venv", "manuscript"]

[lint]
select = ["E", "F", "I"]

# Listings are excerpts and use names defined in earlier listings, so
# undefined-name fires everywhere and means nothing here.
ignore = ["F821"]

[format]
docstring-code-format = true

# Ruff's notebook formatter rewrites the surrounding JSON too, which makes
# diffs unreadable. Lint notebooks, don't format them.
exclude = ["*.ipynb"]
